    - data:
        code: "def main(templates_data):\n    # 1. 检查输入是否有效\n    if not templates_data:\n\
          \        return {\"template_summary\": \"无可用模板\"}\n    \n    # 2. 检查业务状态码（如果有\
          \ code 字段）\n    if isinstance(templates_data, dict):\n        if templates_data.get(\"\
          code\") != 200:\n            return {\"template_summary\": f\"接口返回错误: {templates_data.get('msg',\
          \ '未知错误')}\"}\n        # 提取 data 列表\n        data_list = templates_data.get(\"\
          data\")\n        if not data_list:\n            return {\"template_summary\"\
          : \"接口返回的 data 为空\"}\n    else:\n        # 如果传入的已经是 data 列表（取决于上游如何配置），直接使用\n\
          \        data_list = templates_data\n    \n    # 3. 确保 data_list 是列表类型\n\
          \    if not isinstance(data_list, list):\n        return {\"template_summary\"\
          : f\"数据类型错误，期望列表，实际是 {type(data_list).__name__}\"}\n    \n    if len(data_list)\
          \ == 0:\n        return {\"template_summary\": \"无可用模板\"}\n    \n    # 4.\
          \ 生成摘要字符串\n    summary_lines = []\n    for item in data_list:\n        #\
          \ 防御：确保 item 是字典\n        if not isinstance(item, dict):\n            continue\n\
          \        item_id = item.get(\"id\", \"无ID\")\n        name = item.get(\"\
          name\", \"无名称\")\n        summary = item.get(\"summary\", \"无说明\")\n   \
          \     summary_lines.append(f\"ID: {item_id}\\n名称: {name}\\n说明: {summary}\\\
          n\")\n    \n    if not summary_lines:\n        return {\"template_summary\"\
          : \"没有有效的模板数据\"}\n    \n    return {\"template_summary\": \"\\n\".join(summary_lines)}"
