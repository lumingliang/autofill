          , {})\n\n        # 格式化聊天记录\n        formatted_chat = \"\"\n        for msg\
          \ in chat_messages:\n            role = \"用户\" if msg.get(\"type\") == \"\
          user\" else \"客服\"\n            text = msg.get(\"msg\", \"\")\n        \
          \    formatted_chat += f\"{role}：{text}\\n\"\n\n        return {\n     \
          \  \n            \"formatted_chat\": formatted_chat\n            \n    \
          \    }\n    except Exception as e:\n        return {\n       \n        \
          \    \"formatted_chat\": \"\",\n        \n            \"error\": str(e)\n\
          \        }"
