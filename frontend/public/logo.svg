<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="48" fill="linear-gradient(135deg, #667eea 0%, #764ba2 100%)"/>
  
  <!-- 内部渐变定义 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 外圈 -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)"/>
  
  <!-- AI 文字 -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="white">AI</text>
  
  <!-- 装饰性圆点 -->
  <circle cx="25" cy="35" r="4" fill="url(#grad2)"/>
  <circle cx="75" cy="35" r="4" fill="url(#grad2)"/>
  <circle cx="25" cy="65" r="4" fill="url(#grad2)"/>
  <circle cx="75" cy="65" r="4" fill="url(#grad2)"/>
</svg>