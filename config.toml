[database]
# 数据库配置 - 仅支持 MySQL

[database.mysql]
host = "127.0.0.1"
port = 3306
user = "root"
password = "root123456"
database = "autofill"

[app]
# 应用配置
debug = true
secret_key = "3488a63e1765035d386f05409663f55c83bfae3b3c61a932744b20ad14244dcf"
jwt_access_token_expire_minutes = 10080  # 7天

[app.cors]
origins = ["*"]
allow_credentials = true
allow_methods = ["*"]
allow_headers = ["*"]

[upload]
# 上传文件保存目录
upload_dir = "./uploads"
# 头像保存子目录
avatar_dir = "./uploads/avatars"
# 允许的文件类型
allowed_extensions = ["jpg", "jpeg", "png", "gif", "webp"]
# 最大文件大小 (MB)
max_file_size = 5
# 文件访问URL前缀
file_url_prefix = "/uploads"

[redis]
# Redis配置 - 全局缓存组件
host = "127.0.0.1"
port = 6379
password = "redis123456"
db = 3
key_prefix = "auto_fill"

[dify]
# Dify AI 服务配置
dify_timeout = 180

[kafka]
# Kafka 连接配置
bootstrap_servers = "localhost:9092"
client_id = "autofill-python-client"

# 生产者配置
[kafka.producer]
acks = "all"              # 等待所有副本确认
retries = 3               # 发送失败重试次数
batch_size = 16384        # 批量发送大小
linger_ms = 10            # 延迟发送时间

# 消费者配置
[kafka.consumer]
group_id = "autofill-consumer-group"
auto_offset_reset = "earliest"   # 从最早消息开始消费
enable_auto_commit = true        # 自动提交偏移量
auto_commit_interval_ms = 5000   # 自动提交间隔

# 主题配置
[kafka.topic]
name = "autofill.ai.requests"
partitions = 3
replication_factor = 1

[logging]
# 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"
# 日志文件路径
log_file = "./logs/app.log"
# 日志文件最大大小 (MB)
max_bytes = 10
# 备份文件数量
backup_count = 5
# 是否输出到控制台
console_output = true
# 是否输出到文件
file_output = true
# 日志格式: text, json
format = "json"
# 是否启用请求追踪 ID
enable_request_id = true

[litellm]
# LiteLLM 网关地址
base_url = "http://localhost:4000"
# LiteLLM 网关 API Key（用于管理接口）
master_key = "sk-litellm-master-key"
# 默认超时时间（秒）
timeout = 60

[structured_output]
# 方法失败阈值，达到此值后自动标记为不支持
failed_threshold = 2
# 是否自动更新模型能力状态
auto_update_capabilities = true
# 默认方法优先级（可被请求参数覆盖）
default_method_priority = [
    "with_structured_output",
    "bind_tools_stream",
    "custom_fc_non_stream",
    "custom_fc_stream",
    "pydantic_parser",
    "json_parser"
]
# 是否启用方法降级
enable_fallback = true
# 最大尝试方法数（防止无限循环）
max_attempt_methods = 6
