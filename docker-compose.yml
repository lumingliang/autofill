  # LiteLLM 服务 - 使用官方镜像
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ${LITELLM_CONTAINER_NAME:-autofill-litellm}
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm123456}@postgres:5432/${POSTGRES_DB:-litellm}
      LOG_LEVEL: ${LITELLM_LOG_LEVEL:-INFO}
      STORE_MODEL_IN_DB: "true"
      STORE_PROMPTS_IN_SPEND_LOGS: "true"
      # 可选：Redis 配置用于缓存
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      # LiteLLM 配置文件
      - ${LITELLM_CONFIG_PATH:-./litellm/config.yaml}:/app/config.yaml:ro
    networks:
      - autofill-network
    depends_on:
      postgres:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]

networks:
  autofill-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  seekdb_data:
    driver: local
