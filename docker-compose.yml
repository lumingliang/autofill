services:
  # PostgreSQL for LiteLLM
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-autofill-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm123456}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${POSTGRES_DATA_PATH:-postgres_data}:/var/lib/postgresql/data
      # 可选：挂载初始化SQL脚本
      - ${POSTGRES_INIT_PATH:-./init/postgres}:/docker-entrypoint-initdb.d:ro
    networks:
      - autofill-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # SeekDB - 使用官方镜像
  seekdb:
    image: ${SEEKDB_IMAGE:-oceanbase/seekdb:latest}
    container_name: ${SEEKDB_CONTAINER_NAME:-autofill-seekdb}
    restart: unless-stopped
    ports:
      - "${SEEKDB_PORT:-2881}:2881"
    environment:
      # SeekDB 配置
      ROOT_PASSWORD: ${SEEKDB_ROOT_PASSWORD:-seekdb123456}
      CPU_COUNT: ${SEEKDB_CPU_COUNT:-4}
      MEMORY_LIMIT: ${SEEKDB_MEMORY_LIMIT:-2G}
      LOG_DISK_SIZE: ${SEEKDB_LOG_DISK_SIZE:-2G}
      DATAFILE_SIZE: ${SEEKDB_DATAFILE_SIZE:-2G}
      DATAFILE_NEXT: ${SEEKDB_DATAFILE_NEXT:-2G}
      DATAFILE_MAXSIZE: ${SEEKDB_DATAFILE_MAXSIZE:-50G}
      # 可选：初始化脚本路径
      INIT_SCRIPTS_PATH: ${SEEKDB_INIT_SCRIPTS_PATH:-}
    volumes:
      - ${SEEKDB_DATA_PATH:-seekdb_data}:/var/lib/oceanbase
      # 可选：挂载配置文件
      - ${SEEKDB_CONFIG_PATH:-./init/seekdb}:/etc/oceanbase:ro
      # 可选：挂载初始化SQL脚本
      - ${SEEKDB_INIT_PATH:-./init/seekdb/init.d}:/root/boot/init.d:ro
    networks:
      - autofill-network
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p${SEEKDB_ROOT_PASSWORD:-seekdb123456} -h127.0.0.1 -P2881 -e 'SELECT 1' 2>/dev/null || mysql -uroot -h127.0.0.1 -P2881 -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

