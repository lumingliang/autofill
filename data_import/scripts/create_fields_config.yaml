# 智能字段创建脚本配置文件
# 用于 create_smart_fields.py

# API配置
api:
  base_url: "http://localhost:9999"
  api_key: "af_1fzDujUFl7SLg9L3CWMSV5upBT4GU1bR"

# 页面和字段组配置
page:
  page_name: "话务工作台"
  field_group_name: "事件类型"

# CSV数据源配置
csv:
  # CSV文件路径（相对于当前目录或绝对路径）
  file_path: "/Users/lu/code/code/py/autofill/scripts/useful/data_import/data/event_types.csv"
  
  # 字段映射配置 - 定义CSV中的列名
  field_mapping:
    level1:
      name: "一级事件类型"           # 一级事件类型名称列
      id: "一级事件类型ID"           # 一级事件类型ID列（可选，为空则自动生成）
      instruction: "一级事件类型填写说明"  # 一级填写说明列
    level2:
      name: "二级事件类型"
      id: "二级事件类型ID"
      instruction: "二级事件类型填写说明"
    level3:
      name: "三级事件类型"
      id: "三级事件类型ID"
      instruction: "三级事件类型填写说明"

# 主字段配置（一级下拉字段）
main_field:
  # 主字段名称和标签
  name: "一级事件类型"
  label: "一级事件类型"

  # 组合级别配置 - 决定主字段使用哪些级别的数据
  # 可选值: "level1", "level2", "level3", "level1-level2", "level2-level3", "level1-level2-level3"
  # - "level1": 只使用一级事件类型
  # - "level1-level2": 组合一级和二级事件类型（如：道路救援-拖车服务）
  # - "level2-level3": 组合二级和三级事件类型
  # - "level1-level2-level3": 组合所有三级
  combine_levels: "level1"
  
  # 组合时的分隔符
  separator: "-"
  
  # 填写说明来源字段配置
  # 指定从哪些级别获取 instruction，如 "level1", "level1-level2"
  # - 如果配置 "level1": 只使用 level1 的 instruction
  # - 如果配置 "level1-level2": 合并 level1 和 level2 的 instruction（每级一行）
  # - 如果不配置，默认使用 combine_levels 的值
  instruction_fields: "level1"

# 次字段配置（级联字段）
secondary_field:
  # 是否创建次字段
  enabled: true

  # 次字段名称后缀
  # 实际字段名 = 主字段选项值 + separator + suffix
  # 例如：主选项"道路救援" + "-" + "详细分类" = "道路救援-详细分类"
  suffix: "-二三级事件类型"

  # 组合级别配置 - 决定次字段使用哪些级别的数据
  # 可选值与 main_field.combine_levels 相同
  # 注意：次字段的组合级别应该与主字段不同，形成级联关系
  # 例如：主字段用 level1，次字段用 level2-level3
  combine_levels: "level2-level3"
  
  # 组合时的分隔符
  separator: "-"
  
  # 填写说明来源字段配置，规则同 main_field
  # 例如：配置 "level2-level3" 则合并二级和三级的 instruction
  instruction_fields: "level2-level3"

# ID生成配置
id_generation:
  # 一级ID前缀
  level1_prefix: "EVT"
  # ID数字位数（如3表示 EVT001, EVT002）
  digit_length: 3
  # 是否使用层级前缀（二级ID是否包含父级ID）
  use_hierarchical_id: true

# 选项配置
options:
  # 选项排序方式: "id"(按ID排序), "name"(按名称排序), "original"(保持原始顺序)
  sort_by: "id"
  
  # 是否去重（相同名称的选项只保留一个）
  deduplicate: true
  
  # 空值处理
  skip_empty: true

# 高级配置
advanced:
  # 请求超时时间（秒）
  timeout: 30
  
  # 是否验证字段创建成功
  verify_creation: true
  
  # 批量创建时的间隔时间（秒）
  batch_interval: 0.5
  
  # 是否输出详细日志
  verbose: true
