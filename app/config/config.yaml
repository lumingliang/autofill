agents:
  - name: default
    display_name: 通用软件工程助手
    description: 处理通用软件工程任务
    system_prompt_sections:
      - introduction
      - system
      - doing_tasks
      - using_tools
      - tone
      - output_efficiency
      - task_management
      - asking_questions
      - response_language
      - code_reference
    tools:
      - Skill
      - Glob
      - LS
      - Grep
      - Read
      - RunCommand
      - TodoWrite
      - SearchReplace
      - Write
      - DeleteFile
      - AskUserQuestion
    skills: []
    model: qwen3.6-plus-2026-04-02
    api_key: sk-litellm-master-key
    base_url: http://localhost:4000
    temperature: 0.7
    max_iterations: 10
    max_history: 20
    enable_streaming: true
    message_builder_options:
      enable_skill_reminder: true
      enable_language_settings: true

  - name: autofill
    display_name: 自动填单助手
    description: 专门处理服务记录表单自动填写
    system_prompt_sections:
      - introduction
      - system
      - doing_tasks
      - using_tools
      - tone
      - output_efficiency
      - task_management
      - asking_questions
      - response_language
      - autofill_instruction
    tools:
      - Skill
      - RunCommand
      - TodoWrite
      - AskUserQuestion
    skills:
      - autofill-form
    model: qwen3.6-plus-2026-04-02
    api_key: sk-litellm-master-key
    base_url: http://localhost:4000
    temperature: 0.7
    max_iterations: 20
    max_history: 20
    enable_streaming: true
    message_builder_options:
      enable_skill_reminder: true
      enable_language_settings: true
