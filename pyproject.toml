[project]
name = "vue-fastapi-admin"
version = "0.1.0"
description = "Vue Fastapi admin"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "uvloop==0.21.0; sys_platform != 'win32'",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
    "aiohttp==3.11.11",
    
    # Database
    "tortoise-orm==0.23.0",
    "aerich==0.8.1",
    "aiomysql==0.3.2",
    "aiosqlite==0.20.0",
    "pypika-tortoise==0.3.2",
    
    # Pydantic & Settings
    "pydantic==2.10.5",
    "pydantic-settings==2.7.1",
    "pydantic-core==2.27.2",
    "annotated-types==0.7.0",
    "email-validator==2.2.0",
    
    # Authentication & Security
    "pyjwt==2.10.1",
    "bcrypt==4.3.0",
    "argon2-cffi==23.1.0",
    "argon2-cffi-bindings==21.2.0",
    "passlib==1.7.4",
    
    # Kafka
    "confluent-kafka==2.8.0",
    
    # Redis
    "redis>=5.0.0",
    
    # Image Processing
    "pillow==11.0.0",
    
    # Configuration
    "toml==0.10.2",
    "python-dotenv==1.0.1",
    
    # Logging
    "structlog==25.3.0",
    
    # LLM & LangChain
    "langchain==1.3.11",
    "langchain-openai==1.3.3",
    "langchain-community==0.4.2",
    
    # OpenAPI/Swagger Parsing
    "prance==23.6.21.0",
    "pyyaml==6.0.2",
    
    # JSONPath
    "jsonpath-ng==1.7.0",
    
    # Curl Parser
    "curl_parsers==0.2.1",
    
    # Progress Bar
    "tqdm==4.67.1",
    
    # seekdb - AI Native Search Database
    "pyseekdb>=1.2.0",
    
    # Excel & Data Processing
    "pandas>=2.0.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    
    # FastAPI Dependencies
    "fastapi-cli==0.0.7",
    "starlette==0.37.2",
    "anyio==4.8.0",
    "h11==0.14.0",
    "httptools==0.6.4",
    "websockets==14.1",
    "watchfiles==1.0.4",
    "orjson==3.10.14",
    "ujson==5.10.0",
    
    # CLI & Utils
    "click==8.1.8",
    "asyncclick==8.1.8",
    "typer==0.15.1",
    "shellingham==1.5.4",
    "rich==13.9.4",
    "rich-toolkit==0.13.2",
    "pygments==2.19.1",
    
    # HTTP & DNS
    "httpcore==1.0.7",
    "certifi==2024.12.14",
    "idna==3.10",
    "dnspython==2.7.0",
    "sniffio==1.3.1",
    
    # Templating
    "jinja2==3.1.5",
    "markupsafe==3.0.2",
    "markdown-it-py==3.0.0",
    "mdurl==0.1.2",
    
    # Time & Date
    "iso8601==2.1.0",
    "pytz==2024.2",
    
    # Cryptography
    "cffi==1.17.1",
    "pycparser==2.22",
    
    # Development Tools
    "black==24.10.0",
    "isort==5.13.2",
    "ruff==0.9.1",
    "mypy-extensions==1.0.0",
    "pathspec==0.12.1",
    "platformdirs==4.3.6",
    "packaging==24.2",
    "dictdiffer==0.9.0",
    
    # Typing
    "typing-extensions==4.12.2",
]

[[project.authors]]
name = "mizhexiaoxiao"
email = "mizhexiaoxiao@gmail.com"

[tool.black]
line-length = 120
target-version = ["py310", "py311"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = []
ignore = ["F403", "F405"]

[tool.aerich]
tortoise_orm = "app.settings.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."
