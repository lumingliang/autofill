general_settings:
  master_key: sk-litellm-master-key
  port: 4000
  host: 0.0.0.0
  # 数据库连接从环境变量 DATABASE_URL 读取
  store_model_in_db: true
  # 启用 prompts 存储以查看完整请求和响应
  store_prompts_in_spend_logs: true

